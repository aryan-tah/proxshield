version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    labels: ["dependencies", "type: chore"]
    commit-message:
      prefix: chore
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: monthly
    labels: ["dependencies", "type: chore"]
    commit-message:
      prefix: chore
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies", "type: chore"]
    commit-message:
      prefix: chore
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies", "type: chore"]
    commit-message:
      prefix: ci
